[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-game"
version = "0.1.0"
description = "A two-player online trading card game built with pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "pytest",
]

[project.scripts]
card-game = "card_game.app:main"
card-game-server = "card_game.server:main"

[tool.setuptools.packages.find]
include = ["card_game*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
